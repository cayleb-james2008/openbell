[package]
name = "openbell-rs"
version = "0.19.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.serde]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.itoa]
opt-level = 3

[profile.release.package.ryu]
opt-level = 3

[dependencies]
base64 = "0.22"
getrandom = "0.2"
num-bigint = "0.4"
rune = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ring = "0.17"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
