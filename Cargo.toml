[package]
name = "openbell-rs"
version = "0.35.0"
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
opt-level = "z"
panic = "abort"

[profile.release.package."*"]
opt-level = "z"

[profile.release.package.serde]
opt-level = "z"

[profile.release.package.serde_json]
opt-level = "z"

[profile.release.package.memchr]
opt-level = "z"

[profile.release.package.itoa]
opt-level = "z"

[profile.release.package.ryu]
opt-level = "z"

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
getrandom = "0.2"
rune = { version = "0.14", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false }

[dev-dependencies]
num-bigint = "0.4"
sha2 = { version = "0.11", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
num-bigint = "0.4"
sha2 = { version = "0.11", default-features = false }

[target.'cfg(not(target_os = "windows"))'.dependencies]
ring = "0.17"
ureq = { version = "2", default-features = false, features = ["tls"] }
